name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  dotnet:
    name: .NET build, test, OpenAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # No packages.lock.json in the repo, so cache the NuGet folder keyed on the project files
      # (apphost.cs carries its #:sdk / #:package directives).
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'apphost.cs') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AspireTest.slnx

      # Building src/Api regenerates src/Api/openapi/Api.json (Microsoft.Extensions.ApiDescription.Server).
      - name: Build solution
        run: dotnet build AspireTest.slnx -c Release --no-restore

      - name: Build AppHost (file-based)
        run: dotnet build apphost.cs -c Release

      - name: Test
        run: >-
          dotnet test tests/Api.Tests/Api.Tests.csproj -c Release --no-build
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Fail on OpenAPI drift
        run: |
          if ! git diff --exit-code -- src/Api/openapi/Api.json; then
            echo "::error file=src/Api/openapi/Api.json::Api.json is out of date. Run 'dotnet build src/Api' and commit the result."
            exit 1
          fi

  web:
    name: Web (Astro) gen, check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - run: npm ci

      # Regenerate the API types from the committed Api.json (the dotnet job guards Api.json itself).
      - name: Generate API types
        run: npm run gen:api

      - name: Fail on API types drift
        run: |
          if ! git diff --exit-code -- src/lib/api/schema.d.ts; then
            echo "::error file=src/Web/src/lib/api/schema.d.ts::schema.d.ts is out of date. Run 'npm run gen:api' in src/Web and commit the result."
            exit 1
          fi

      - name: Astro check
        run: npm run check

      # `npm run build` is `astro check && astro build`; check already ran above, so only build here.
      - name: Astro build
        run: npx astro build

  terraform:
    name: Terraform fmt, validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.x
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # -lockfile=readonly fails if a provider was added/changed without updating .terraform.lock.hcl.
      - name: terraform init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate

  # Runs in parallel with the other jobs: each Dockerfile does its own restore/build inside the
  # image, so gating on dotnet/web would only add wall-clock time without sharing any output.
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cms
            context: src
            file: src/Cms/Dockerfile
          - image: api
            context: src
            file: src/Api/Dockerfile
          - image: web
            context: src/Web
            file: src/Web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: aspire-test/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
