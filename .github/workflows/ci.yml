name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  dotnet:
    name: .NET build, test, OpenAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # No packages.lock.json in the repo, so cache the NuGet folder keyed on the project files
      # (apphost.cs carries its #:sdk / #:package directives).
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'apphost.cs') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AspireTest.slnx

      # Building src/Api regenerates src/Api/openapi/Api.json (Microsoft.Extensions.ApiDescription.Server).
      - name: Build solution
        run: dotnet build AspireTest.slnx -c Release --no-restore

      # AspireUseCliBundle=true: without an `aspire` CLI on PATH the build fetches the matching CLI bundle itself
      # (`dnx aspire.cli@<sdk version> -- setup`, into ~/.aspire), so no separate install step is needed. That
      # fallback looks for `dnx` on PATH, i.e. the dotnet install dir that setup-dotnet adds.
      - name: Build AppHost (file-based)
        run: dotnet build apphost.cs -c Release

      - name: Test
        run: >-
          dotnet test AspireTest.slnx -c Release --no-build
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Fail on OpenAPI drift
        run: |
          if ! git diff --exit-code -- src/Api/openapi/Api.json; then
            echo "::error file=src/Api/openapi/Api.json::Api.json is out of date. Run 'dotnet build src/Api' and commit the result."
            exit 1
          fi

      - name: Fail on Delivery API models drift
        run: |
          node scripts/gen-delivery-api.mjs
          if ! git diff --exit-code -- src/Api/Content/Umbraco/DeliveryApiModels.g.cs; then
            echo "::error file=src/Api/Content/Umbraco/DeliveryApiModels.g.cs::DeliveryApiModels.g.cs is out of date with delivery-api.json. Run 'node scripts/gen-delivery-api.mjs' and commit the result."
            exit 1
          fi

  architecture:
    name: Architecture diagram
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commits the regenerated diagram on main
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'apphost.cs') }}
          restore-keys: nuget-${{ runner.os }}-

      # Runs the AppHost with the manifest publisher and rewrites the Mermaid block in README.md.
      - name: Generate diagram
        run: node scripts/gen-architecture.mjs

      - name: Warn on drift (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --exit-code -- README.md; then
            echo "::warning file=README.md::The architecture diagram is out of date; it is regenerated on merge to main (or run 'node scripts/gen-architecture.mjs')."
          fi

      # Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
      - name: Commit diagram (main)
        if: github.event_name == 'push'
        run: |
          git diff --quiet -- README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update architecture diagram" -- README.md
          git push

  web:
    name: Web (Astro) gen, check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/Web/.nvmrc # same major as the src/Web/Dockerfile base image
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - run: npm ci

      # Regenerate the API types from the committed Api.json (the dotnet job guards Api.json itself).
      - name: Generate API types
        run: npm run gen:api

      - name: Fail on API types drift
        run: |
          if ! git diff --exit-code -- src/lib/api/schema.d.ts; then
            echo "::error file=src/Web/src/lib/api/schema.d.ts::schema.d.ts is out of date. Run 'npm run gen:api' in src/Web and commit the result."
            exit 1
          fi

      - name: Astro check
        run: npm run check

      # `npm run build` is `astro check && astro build`; check already ran above, so only build here.
      - name: Astro build
        run: npx astro build

  terraform:
    name: Terraform fmt, validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.x
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # -lockfile=readonly fails if a provider was added/changed without updating .terraform.lock.hcl.
      - name: terraform init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate

  # Runs in parallel with the other jobs: each Dockerfile does its own restore/build inside the
  # image, so gating on dotnet/web would only add wall-clock time without sharing any output.
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cms
            context: src
            file: src/Cms/Dockerfile
          - image: api
            context: src
            file: src/Api/Dockerfile
          - image: web
            context: src/Web
            file: src/Web/Dockerfile
          - image: commerce
            context: src/Commerce
            file: src/Commerce/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: aspire-test/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
